<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
 
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#0f2a44" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f2a44" />
 
  <link rel="icon" type="image/png" href="https://i.ibb.co.com/WNgFp3Nr/40e2900fa00898bd13b91ceefd4d5d09.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
 
  <title>BN - ToS</title>

  <!-- CSS Config -->
  <link rel="stylesheet" href="css/terms.css">

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg-deep: #040a14; --bg-mid: #0a1628; --card-bg: #0f1e35;
      --card-border: #1a2e4a; --accent: #38bdf8; --accent-dim: rgba(56,189,248,0.15);
      --text: #e2e8f0; --text-muted: #7a91ad;
      --font-display: 'Orbitron', sans-serif; --font-body: 'Inter', sans-serif;
    }
    html { scroll-behavior: smooth; }
    body { background: var(--bg-deep); color: var(--text); font-family: var(--font-body); min-height: 100vh; overflow-x: hidden; }
    body::before {
      content: ''; position: fixed; top: -20%; left: 50%; transform: translateX(-50%);
      width: 800px; height: 500px;
      background: radial-gradient(ellipse, rgba(56,189,248,0.07) 0%, transparent 70%);
      pointer-events: none; z-index: 0;
    }
    /* TOP BAR */
    .top-bar {
      position: fixed; top: 20px; left: 20px; right: 20px;
      display: flex; align-items: center; justify-content: space-between;
      z-index: 1000; pointer-events: none;
    }
    .back-btn {
      display: flex; align-items: center; gap: 8px;
      padding: 9px 16px;
      background: rgba(9,18,34,0.75); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(56,189,248,0.18); border-radius: 12px;
      color: var(--text-muted); font-family: var(--font-body); font-size: 13px; font-weight: 500;
      text-decoration: none; cursor: pointer; pointer-events: all;
      transition: color .2s, background .2s, border-color .2s;
    }
    .back-btn:hover { color: var(--accent); background: var(--accent-dim); border-color: rgba(56,189,248,0.35); }
    .back-btn svg { width: 16px; height: 16px; flex-shrink: 0; }
    .lang-switcher {
      display: flex; align-items: center; gap: 4px;
      padding: 6px 8px;
      background: rgba(9,18,34,0.75); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(56,189,248,0.18); border-radius: 12px;
      pointer-events: all;
    }
    .lang-btn {
      display: flex; align-items: center; gap: 5px;
      padding: 5px 10px; border-radius: 8px;
      background: transparent; border: 1px solid transparent;
      color: var(--text-muted); font-family: var(--font-body); font-size: 12px; font-weight: 500;
      cursor: pointer;
      transition: color .2s, background .2s, border-color .2s;
    }
    .lang-btn:hover { color: var(--accent); background: var(--accent-dim); }
    .lang-btn.active { color: var(--accent); background: var(--accent-dim); border-color: rgba(56,189,248,0.3); }
    .lang-sep { color: var(--card-border); font-size: 11px; user-select: none; }
    /* PAGE HEADER */
    .page-header { padding: 90px 20px 60px; text-align: center; position: relative; z-index: 1; }
    .page-eyebrow {
      display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase;
      color: var(--accent); background: var(--accent-dim); border: 1px solid rgba(56,189,248,0.25);
      padding: 5px 14px; border-radius: 100px; margin-bottom: 20px; animation: fadeUp .6s ease both;
    }
    .page-header h1 {
      font-family: var(--font-display); font-size: clamp(22px,4vw,40px); font-weight: 900;
      letter-spacing: -0.5px; line-height: 1.2; margin-bottom: 14px; animation: fadeUp .6s .1s ease both;
    }
    .page-header h1 span { color: var(--accent); }
    .page-header .meta { font-size: 13px; color: var(--text-muted); animation: fadeUp .6s .2s ease both; }
    /* CONTENT */
    .content-wrap { max-width: 780px; margin: 0 auto; padding: 0 20px 100px; position: relative; z-index: 1; }
    .toc {
      background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 14px;
      padding: 24px 26px; margin-bottom: 40px; animation: fadeUp .6s .35s ease both;
    }
    .toc-title { font-family: var(--font-display); font-size: 10px; letter-spacing: 2.5px; text-transform: uppercase; color: var(--accent); margin-bottom: 16px; }
    .toc ol { list-style: none; counter-reset: toc; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px,1fr)); gap: 6px 24px; }
    .toc ol li { counter-increment: toc; }
    .toc ol li a { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-muted); text-decoration: none; padding: 5px 0; transition: color .2s; }
    .toc ol li a::before { content: counter(toc,decimal-leading-zero) "."; font-family: var(--font-display); font-size: 10px; color: var(--accent); opacity: .7; flex-shrink: 0; }
    .toc ol li a:hover { color: var(--accent); }
    .terms-section { margin-bottom: 36px; animation: fadeUp .6s .4s ease both; }
    .section-num { font-family: var(--font-display); font-size: 10px; letter-spacing: 2px; color: var(--accent); opacity: .6; margin-bottom: 6px; display: block; }
    .terms-section h2 { font-family: var(--font-display); font-size: 15px; font-weight: 700; letter-spacing: .5px; color: var(--text); margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px solid var(--card-border); }
    .terms-section p { font-size: 14px; color: var(--text-muted); line-height: 1.8; margin-bottom: 12px; }
    .terms-section ul, .terms-section ol { padding-left: 20px; margin-bottom: 12px; }
    .terms-section li { font-size: 14px; color: var(--text-muted); line-height: 1.8; margin-bottom: 6px; }
    .terms-section li::marker { color: var(--accent); }
    .terms-section a { color: var(--accent); text-decoration: none; border-bottom: 1px solid rgba(56,189,248,0.3); transition: border-color .2s; }
    .terms-section a:hover { border-color: var(--accent); }
    .highlight-box { background: var(--accent-dim); border: 1px solid rgba(56,189,248,0.2); border-left: 3px solid var(--accent); border-radius: 0 10px 10px 0; padding: 14px 18px; margin: 16px 0; }
    .highlight-box p { font-size: 13px; color: var(--text); margin: 0; line-height: 1.7; }

    @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .terms-section:nth-child(2) { animation-delay: .45s; } .terms-section:nth-child(3) { animation-delay: .5s; }
    .terms-section:nth-child(4) { animation-delay: .55s; } .terms-section:nth-child(5) { animation-delay: .6s; }
    .terms-section:nth-child(6) { animation-delay: .65s; } .terms-section:nth-child(7) { animation-delay: .7s; }
    .terms-section:nth-child(8) { animation-delay: .75s; } .terms-section:nth-child(9) { animation-delay: .8s; }
    .terms-section:nth-child(10) { animation-delay: .85s; }

    /* Fade transition for language switch */
    .fade-out { opacity: 0; transition: opacity 0.18s ease; }
    .fade-in  { opacity: 1; transition: opacity 0.22s ease; }
    #main-content { opacity: 1; }
  </style>
</head>
<body>

<div class="top-bar">
  <a class="back-btn" href="javascript:history.back()">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    <span data-i18n="back">Kembali</span>
  </a>
  <div class="lang-switcher">
    <button class="lang-btn active" onclick="setLang('id')">🇮🇩 ID</button>
    <span class="lang-sep">|</span>
    <button class="lang-btn" onclick="setLang('en')">🇬🇧 EN</button>
    <span class="lang-sep">|</span>
    <button class="lang-btn" onclick="setLang('jp')">🇯🇵 JP</button>
  </div>
</div>

<header class="page-header">
  <span class="page-eyebrow">🔵 BN 🔵 &nbsp;·&nbsp; Terms of Services</span>
  <h1>Terms of <span>Services</span></h1>
  <p class="meta" data-i18n="lastUpdated">Terakhir diperbarui: 23 Mei 2026</p>
</header>

<div id="main-content">
  <main class="content-wrap">
    <div class="toc">
      <p class="toc-title" data-i18n="tocTitle">Daftar Isi</p>
      <ol id="toc-list"></ol>
    </div>
    <div class="highlight-box" style="margin-bottom:32px; animation: fadeUp 0.6s 0.38s ease both;">
      <p id="global-notice-text" data-i18n="globalNotice">📌 Bergabung di komunitas ini berarti Anda siap ikut menjaga suasana yang aman, nyaman, dan penuh rasa saling menghargai. Mohon pahami syarat dan ketentuan berikut sebelum melanjutkan.</p>
    </div>
    <div id="sections-container"></div>
  </main>


</div>

<!-- JS Config -->
<script src="js/terms.js"></script>

<!-- Tracking Config -->
<script src="tracker.js"></script>

</body>
</html>
