<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifikasi Akses</title>
    <!-- Font Inter & FontAwesome Icon -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background: radial-gradient(circle at top left, #1a233a, #0d1117);
            color: #f0f6fc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-card {
            background: rgba(22, 27, 34, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 36px 28px;
            border-radius: 16px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.05);
            width: 100%;
            max-width: 360px;
            text-align: center;
            transition: transform 0.2s ease;
        }

        .icon-header {
            width: 56px;
            height: 56px;
            background: rgba(0, 136, 255, 0.15);
            color: #38df lightblue;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px auto;
            font-size: 22px;
            color: #2f81f7;
            border: 1px solid rgba(47, 129, 247, 0.3);
        }

        .login-card h2 {
            margin-bottom: 6px;
            font-size: 20px;
            font-weight: 600;
            color: #ffffff;
        }

        .login-card p.subtitle {
            font-size: 13px;
            color: #8b949e;
            margin-bottom: 24px;
        }

        .input-group {
            position: relative;
            margin-bottom: 18px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 42px 12px 14px;
            border: 1px solid #30363d;
            border-radius: 8px;
            background-color: #0d1117;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .input-group input:focus {
            border-color: #2f81f7;
            box-shadow: 0 0 0 3px rgba(47, 129, 247, 0.25);
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #8b949e;
            cursor: pointer;
            font-size: 14px;
            padding: 4px;
            transition: color 0.2s;
        }

        .toggle-password:hover {
            color: #f0f6fc;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #2f81f7, #1f6feb);
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(31, 111, 235, 0.3);
        }

        button:hover {
            background: linear-gradient(135deg, #388bfd, #2374e1);
            box-shadow: 0 6px 16px rgba(31, 111, 235, 0.4);
        }

        button:active {
            transform: scale(0.98);
        }

        #error-msg {
            color: #ff7b72;
            background: rgba(248, 81, 73, 0.1);
            border: 1px solid rgba(248, 81, 73, 0.2);
            border-radius: 6px;
            padding: 8px 12px;
            font-size: 13px;
            margin-top: 14px;
            display: none;
        }

        /* Animasi Shake saat salah sandi */
        .shake {
            animation: shake 0.3s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }
    </style>
</head>
<body>

    <div class="login-card" id="card">
        <div class="icon-header">
            <i class="fa-solid fa-lock"></i>
        </div>
        <h2>Verifikasi Akses</h2>
        <p class="subtitle">Masukkan sandi untuk melanjutkan</p>

        <form id="passwordForm">
            <div class="input-group">
                <input type="password" id="sandiInput" placeholder="Masukkan Sandi" required autocomplete="current-password">
                <i class="fa-regular fa-eye toggle-password" id="toggleIcon"></i>
            </div>
            <button type="submit">Masuk</button>
            <div id="error-msg"><i class="fa-solid fa-triangle-exclamation"></i> Sandi salah! Coba lagi.</div>
        </form>
    </div>

    <script>    
        const sandi = "2222";
        const form = document.getElementById('passwordForm');
        const inputSandi = document.getElementById('sandiInput');
        const errorMsg = document.getElementById('error-msg');
        const card = document.getElementById('card');
        const toggleIcon = document.getElementById('toggleIcon');

        // Fitur lihat/sembunyikan sandi
        toggleIcon.addEventListener('click', function () {
            const type = inputSandi.getAttribute('type') === 'password' ? 'text' : 'password';
            inputSandi.setAttribute('type', type);
            this.classList.toggle('fa-eye');
            this.classList.toggle('fa-eye-slash');
        });

        // Verifikasi Form
        form.addEventListener('submit', function(e) {
            e.preventDefault();

            if (inputSandi.value === sandi) {
                errorMsg.style.display = 'none';
                window.location.href = "https://halamantidaktersedia.netlify.app"; 
            } else {
                errorMsg.style.display = 'block';
                inputSandi.value = '';
                
                // Efek getar (shake) jika salah
                card.classList.add('shake');
                setTimeout(() => card.classList.remove('shake'), 300);
            }
        });
    </script>

</body>
</html>
